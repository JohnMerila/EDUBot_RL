rl_goal_controller:
  ros__parameters:
    # AMCL supplies a map-frame pose; wheel/filtered odometry supplies velocity.
    pose_source_type: pose_with_covariance_stamped
    pose_topic: /amcl_pose
    velocity_topic: /odom
    scan_topic: /scan
    goal_topic: /goal_pose
    cmd_vel_topic: /cmd_vel
    control_frequency: 20.0
    pose_timeout: 1.0
    scan_timeout: 0.5
    goal_tolerance: 0.3
    emergency_stop_distance: 0.19
    # The A1 laser-frame +x axis points toward its rear cable, which faces the
    # rear of this robot.
    laser_yaw_offset: 3.141592653589793
    lidar_max_range: 8.0
    max_linear_speed: 0.8
    max_angular_speed: 1.5
    max_linear_accel: 1.5
    max_angular_accel: 3.0
    enabled: true
